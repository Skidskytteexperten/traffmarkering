<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Träffmarkering</title>
<style>
  :root { --bg:#101114; --card:#1b1d22; --text:#f3f3f3; --muted:#b8bcc7; --accent:#ff5a7a; }
  * { box-sizing:border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, sans-serif; background:var(--bg); color:var(--text); text-align:center; }
  header { padding:14px 12px 6px; }
  h1 { font-size:22px; margin:0 0 4px; }
  p { margin:4px 0; color:var(--muted); }
  .wrap { max-width:520px; margin:0 auto; padding:8px 12px 24px; }
  .targetBox { position:relative; width:min(92vw,460px); aspect-ratio:1/1; margin:10px auto 12px; background:#f5f5f5; border-radius:22px; border:8px solid #1477d4; box-shadow:0 8px 25px rgba(0,0,0,.35); touch-action:none; }
  .target { position:absolute; inset:9%; border-radius:50%; background:#050505; overflow:hidden; }
  .ring { position:absolute; border-radius:50%; border:2px solid rgba(255,255,255,.85); left:50%; top:50%; transform:translate(-50%,-50%); pointer-events:none; }
  .r1 { width:78%; height:78%; border-style:dotted; opacity:.75; }
  .r2 { width:58%; height:58%; }
  .r3 { width:35%; height:35%; border-style:dotted; }
  .r4 { width:18%; height:18%; }
  .lineV,.lineH { position:absolute; background:rgba(255,255,255,.8); left:50%; top:0; transform:translateX(-50%); width:2px; height:100%; pointer-events:none; }
  .lineH { left:0; top:50%; transform:translateY(-50%); width:100%; height:2px; }
  .shot { position:absolute; width:30px; height:30px; border-radius:50%; background:#ff4f9a; border:2px solid #b51f5d; color:#111; font-weight:800; font-size:14px; display:flex; align-items:center; justify-content:center; transform:translate(-50%,-50%); box-shadow:0 2px 5px rgba(0,0,0,.45); z-index:10; }
  .shot.loaded { background:#ffd400; border-color:#9a7a00; }
  .panel { background:var(--card); border-radius:16px; padding:12px; margin:10px 0; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .stat { background:#272a31; border-radius:12px; padding:8px; }
  .stat strong { display:block; font-size:20px; }
  button, select, input { font:inherit; }
  button { border:0; border-radius:12px; padding:10px 12px; background:#eeeeee; color:#111; font-weight:700; margin:4px; cursor:pointer; }
  button.primary { background:var(--accent); color:white; }
  button.dark { background:#333844; color:white; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  select, input { width:100%; border:0; border-radius:12px; padding:10px; background:#272a31; color:white; margin-top:6px; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:8px; align-items:end; }
  .small { font-size:13px; color:var(--muted); }
  .list { text-align:left; max-height:190px; overflow:auto; margin-top:8px; }
  .savedItem { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px; border-bottom:1px solid #30333b; }
  .savedItem span { color:var(--muted); font-size:13px; }
</style>
</head>

    <button class="dark" onclick="undoShot()">Ångra</button>
    <button class="dark" onclick="newSeries()">Ny serie</button>
    <button class="primary" onclick="saveSeries()">Spara serie</button>
  </div>

  <div class="panel">
    <strong>Sparade serier</strong>
    <p class="small">Välj en sparad serie för att visa den på tavlan senare.</p>
    <select id="savedSelect" onchange="loadSelectedSeries()"></select>
    <div>
      <button class="dark" onclick="showCurrentSeries()">Visa aktuell serie</button>
      <button class="dark" onclick="deleteSelectedSeries()">Ta bort vald</button>
      <button class="dark" onclick="exportSeries()">Exportera</button>
    </div>
    <div class="list" id="savedList"></div>
  </div>
</div>

<script>
const targetBox = document.getElementById('targetBox');
const target = document.getElementById('target');
let shots = [];
let loadedMode = false;

function getTargetRect(){ return target.getBoundingClientRect(); }
function getScore(xPct, yPct){
  const dx = xPct - 50, dy = yPct - 50;
  const d = Math.sqrt(dx*dx + dy*dy);
  if (d <= 9) return 10;
  if (d <= 17.5) return 9;
  if (d <= 29) return 8;
  if (d <= 39) return 7;
  if (d <= 50) return 6;
  return 0;
}

target.addEventListener('pointerdown', e => {
  if (loadedMode) { shots = []; loadedMode = false; }
  const max = 8;
  if (shots.length >= max) return;
  const rect = getTargetRect();
  const xPct = ((e.clientX - rect.left) / rect.width) * 100;
  const yPct = ((e.clientY - rect.top) / rect.height) * 100;
  if (xPct < 0 || xPct > 100 || yPct < 0 || yPct > 100) return;
  shots.push({ nr: shots.length + 1, xPct, yPct, score: getScore(xPct, yPct) });
  renderShots();
});

function renderShots(loaded=false){
  document.querySelectorAll('.shot').forEach(el => el.remove());
  shots.forEach(s => {
    const el = document.createElement('div');
    el.className = 'shot' + (loaded ? ' loaded' : '');
    el.style.left = s.xPct + '%';
    el.style.top = s.yPct + '%';
    el.textContent = s.nr;
    el.title = `Skott ${s.nr}: ${s.score} poäng`;
    target.appendChild(el);
  });
  updateStats();
}

function updateStats(){
  const total = shots.reduce((sum, s) => sum + s.score, 0);
  document.getElementById('count').textContent = shots.length;
  document.getElementById('total').textContent = total;
  document.getElementById('avg').textContent = shots.length ? (total / shots.length).toFixed(1) : '0.0';
}
function undoShot(){ if (loadedMode) return; shots.pop(); renderShots(); }
function newSeries(){ shots = []; loadedMode = false; document.getElementById('seriesName').value=''; renderShots(); }
function showCurrentSeries(){ loadedMode = false; renderShots(false); }

function getSaved(){ return JSON.parse(localStorage.getItem('traffmarkering_serier') || '[]'); }
function setSaved(data){ localStorage.setItem('traffmarkering_serier', JSON.stringify(data)); refreshSaved(); }
function saveSeries(){
  if (!shots.length) { alert('Markera minst ett skott först.'); return; }
  const nameInput = document.getElementById('seriesName').value.trim();
  const now = new Date();
  const total = shots.reduce((sum, s) => sum + s.score, 0);
  const item = {
    id: Date.now(),
    name: nameInput || `Serie ${now.toLocaleDateString('sv-SE')} ${now.toLocaleTimeString('sv-SE', {hour:'2-digit', minute:'2-digit'})}`,
    date: now.toISOString(),
    length: shots.length,
    total,
    avg: shots.length ? total / shots.length : 0,
    shots: shots.map(s => ({...s}))
  };
  const saved = getSaved();
  saved.unshift(item);
  setSaved(saved);
  alert('Serien är sparad.');
}
function loadSelectedSeries(){
  const id = Number(document.getElementById('savedSelect').value);
  const item = getSaved().find(s => s.id === id);
  if (!item) return;
  shots = item.shots.map(s => ({...s}));
  loadedMode = true;
  document.getElementById('seriesName').value = item.name;
  renderShots(true);
}
function deleteSelectedSeries(){
  const id = Number(document.getElementById('savedSelect').value);
  if (!id) return;
  if (!confirm('Ta bort vald serie?')) return;
  setSaved(getSaved().filter(s => s.id !== id));
}
function exportSeries(){
  const data = getSaved();
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'traffmarkering-sparade-serier.json';
  a.click();
  URL.revokeObjectURL(a.href);
}
function refreshSaved(){
  const saved = getSaved();
  const select = document.getElementById('savedSelect');
  select.innerHTML = saved.length ? '' : '<option value="">Inga sparade serier</option>';
  saved.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s.id;
    opt.textContent = `${s.name} – ${s.total} p`;
    select.appendChild(opt);
  });
  const list = document.getElementById('savedList');
  list.innerHTML = '';
  saved.forEach(s => {
    const div = document.createElement('div');
    div.className = 'savedItem';
    div.innerHTML = `<div><b>${escapeHtml(s.name)}</b><br><span>${new Date(s.date).toLocaleString('sv-SE')} · ${s.shots.length} skott · ${s.total} p · snitt ${s.avg.toFixed(1)}</span></div><button onclick="quickLoad(${s.id})">Visa</button>`;
    list.appendChild(div);
  });
}
function quickLoad(id){ document.getElementById('savedSelect').value = id; loadSelectedSeries(); }
function escapeHtml(str){ return str.replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
refreshSaved(); renderShots();
</script>
</body>
</html>
